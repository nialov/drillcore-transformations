[project]
name = "drillcore-transformations"
version = "0.2.6.post9.dev0+a7d935e"
description = "Transform structural drillcore measurements."
authors = [
    { name = "nialov", email = "nikolasovaskainen@gmail.com" }
]
readme = "README.rst"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only"
]
requires-python = ">=3.8"

dependencies = [
    "numpy",
    # "pandas",
    # "matplotlib",
    # "click",
    # "openpyxl",
    # "xlrd"
]

[project.urls]
Homepage = "https://github.com/nialov/drillcore-transformations"
Repository = "https://github.com/nialov/drillcore-transformations"
# Documentation = "https://drillcore-transformations.readthedocs.io/en/latest/"

[project.optional-dependencies]
test = [
    "pytest",
    "hypothesis"
]

[project.scripts]
drillcore-transformations = "drillcore_transformations.cli:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths =[
    "src/drillcore_transformations",
    "src/drillcore_transformations/tests",
    ]
addopts = "--doctest-modules"
doctest_optionflags =[
    "NUMBER",
    "NORMALIZE_WHITESPACE",
    ]

filterwarnings =[]
